name: Build and test

on:
    push:
        branches:
            - main
    pull_request:
        branches:
            - "**"
    workflow_dispatch:

jobs:
    build-and-run-tests:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - name: Test
              run: make test-py

    test-js:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - name: Test
              run: make test-js
