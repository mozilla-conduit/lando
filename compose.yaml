# Sharing the build definition instead of an `image:` tag lets compose name the
# image per project, so parallel checkouts do not clobber each other's builds.
x-lando-build: &lando-build
    build:
        context: .
        args:
            # Build the container's `app` user with the caller's uid. The
            # `make` targets export it; set it in `.env` and rebuild if you
            # drive `docker compose` directly and your uid is not the usual 1000.
            APP_UID: ${APP_UID:-1000}

services:
    db:
        image: postgres:17
        environment:
            POSTGRES_USER: postgres
            POSTGRES_PASSWORD: postgres
        healthcheck:
            test: ["CMD", "pg_isready", "-U", "postgres", "-d", "postgres"]
            interval: 1s
            timeout: 10s
            retries: 10
        volumes:
            - postgres_db:/var/lib/postgresql/data

    lando:
        <<: *lando-build
        stdin_open: true
        tty: true
        command: bash -c "
            lando migrate &&
            lando collectstatic --clear --no-input &&
            uwsgi --ini /code/uwsgi.ini:local"
        volumes:
            - ./:/code
            - media:/files/
            - /code/src/lando/version
        env_file:
            - path: .env
              required: false
        environment:
            DEFAULT_DB_HOST: db
        depends_on:
            db:
                condition: service_healthy
            redis:
                condition: service_healthy

    hg-landing-worker:
        <<: *lando-build
        command: lando start_landing_worker hg
        environment:
            DEFAULT_GRACE_SECONDS: 10
            LANDING_WORKER_USERNAME: app
            LANDING_WORKER_TARGET_SSH_PORT: 8022
            SSH_PRIVATE_KEY: |
                -----BEGIN EC PRIVATE KEY-----
                MHcCAQEEIMiMNKEkf0vr4HrhUIrq0e9NjGNPArN7L1uy/HQZ1dA8oAoGCCqGSM49
                AwEHoUQDQgAEdakNgjerNLFXy1uMfwLjPd5/pBTbIEoZMdMV/o6s+uoMg776LF+v
                gtbfIaZbhDcJElzHwpnqGfHYU+cM4KyurA==
                -----END EC PRIVATE KEY-----
        env_file:
            - path: .env
              required: false
        depends_on:
            db:
                condition: service_healthy

    git-landing-worker:
        <<: *lando-build
        command: lando start_landing_worker git
        environment:
            DEFAULT_GRACE_SECONDS: 10
            LANDING_WORKER_USERNAME: app
        env_file:
            - path: .env
              required: false
        depends_on:
            db:
                condition: service_healthy

    proxy:
        build: ./nginx
        ports:
            # Override to run more than one checkout at once.
            - ${LANDO_PROXY_PORT:-443}:443
        depends_on:
            - lando
        volumes:
            - ./staticfiles:/code/staticfiles

    redis:
        image: redis:7.2
        healthcheck:
            test: ["CMD", "redis-cli", "ping"]

    celery:
        <<: *lando-build
        command: lando start_celery_worker
        depends_on:
            redis:
                condition: service_healthy

volumes:
    media:
    postgres_db:
